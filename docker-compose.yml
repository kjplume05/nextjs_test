services:
  db:
    image: postgres:16
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
volumes:
  postgres_data: